<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Review App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Hero Section -->
<div class="hero" id="heroSection">
    <div class="overlay">
        <h1 class="hero-title">🎬 Discover & Review Movies</h1>
        <div class="search-box">
            <input type="text" id="movieInput" placeholder="Search for a movie..." />
            <button id="searchBtn">Search</button>
            <button id="allReviewsBtnGlobal">All Reviews</button>
        </div>
    </div>
</div>

<!-- Movie container -->
<div class="container" id="movieContainer"></div>

<!-- Cloud animation -->
<canvas id="clouds"></canvas>

<script src="script.js"></script>
</body>
</html>
